openapi: 3.0.0
info:
  version: "1.0.0"
  title: 'WSO2 Identity Server - Device Management API'
  description: 'This document specifies a RESTful API for WSO2 Identity Server Device Management'
  contact:
    name: WSO2
    url: 'http://wso2.com/products/identity-server/'
    email: architecture@wso2.org
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
security:
  - OAuth2: []
  - BasicAuth: []
paths:
  /devices:
    get:
      tags:
        - Device Management
      summary: List all registered devices in the tenant.
      operationId: listDevices
      description: This API provides the capability to list all registered devices for the tenant.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/user/{user-id}:
    get:
      tags:
        - Device Management
      summary: List all devices registered by a specific user.
      operationId: listDevicesByUserId
      description: This API provides the capability to list all registered devices for a specific user.
      parameters:
        - name: user-id
          in: path
          description: UUID of the user
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{device-id}:
    get:
      tags:
        - Device Management
      summary: Get a registered device by ID.
      operationId: getDevice
      description: This API provides the capability to retrieve a registered device by its ID.
      parameters:
        - name: device-id
          in: path
          description: UUID of the registered device
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Device Management
      summary: Rename a registered device.
      operationId: updateDeviceName
      description: This API provides the capability to update the display name of a registered device.
      parameters:
        - name: device-id
          in: path
          description: UUID of the registered device
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Device Management
      summary: Delete a registered device.
      operationId: deleteDevice
      description: This API provides the capability to delete a registered device by its ID.
      parameters:
        - name: device-id
          in: path
          description: UUID of the registered device
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successfully Deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: 'https://localhost:9443/t/{tenant-domain}/api/server/v1'
    variables:
      tenant-domain:
        default: carbon.super
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://localhost:9443/oauth2/authorize'
          tokenUrl: 'https://localhost:9443/oauth2/token'
          scopes:
            read: internal_device_mgt_view
            write: internal_device_mgt_update
            delete: internal_device_mgt_delete
  schemas:
    DeviceResponse:
      type: object
      properties:
        id:
          type: string
          description: The device UUID.
          example: "74070bae-df8c-42bf-8754-5173c237c936"
        userId:
          type: string
          description: The user identifier who owns the device.
          example: "kaviska"
        deviceName:
          type: string
          description: The display name of the device.
          example: "My iPhone"
        deviceModel:
          type: string
          description: The hardware model of the device.
          example: "iPhone 15 Pro"
        status:
          type: string
          description: The current device status.
          example: "ACTIVE"
        registeredAt:
          type: string
          description: The timestamp when the device was registered.
          example: "2026-04-27T10:00:00.000Z"
        metadata:
          type: string
          description: Additional metadata associated with the device.
          example: "{\"osVersion\":\"17.0\",\"pushToken\":\"abc123\"}"
    DevicePatchRequest:
      type: object
      required:
        - deviceName
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 255
          description: The new display name for the device.
          example: "My Work Phone"
    Error:
      type: object
      properties:
        code:
          type: string
          example: DM-60001
        message:
          type: string
          example: Some Error Message.
        description:
          type: string
          example: Some Error Description.
        traceId:
          type: string
          example: "e0fbcfeb-3617-43c4-8dd0-7b7d38e13047"
